<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>技能投掷物与效果 Demo</title>
    <link rel="stylesheet" href="css/skill-demo.css">
</head>
<body>
    <main class="demo-shell">
        <header class="demo-header">
            <div>
                <p class="eyebrow">SKILL BOUND / RENDER LAB</p>
                <h1>投掷物与效果 Demo</h1>
                <p class="subtitle">数据来自 玩法.md。这里验证技能形状、投射轨迹和范围效果的程序化渲染。</p>
            </div>
            <div class="status" id="status">加载技能数据...</div>
        </header>

        <section class="toolbar" aria-label="技能筛选">
            <label>类别<select id="category-filter"><option value="all">全部</option></select></label>
            <label>技能<select id="skill-select"></select></label>
            <label>等级<select id="level-select"><option value="0">Lv1</option><option value="1">Lv2</option><option value="2">Lv3</option><option value="3">Lv4</option></select></label>
            <button id="replay-button" type="button">重新播放</button>
        </section>

        <section class="demo-grid">
            <div class="stage-panel">
                <div class="stage-title"><span id="skill-title">-</span><span id="shape-label">-</span></div>
                <canvas id="demo-canvas" width="960" height="560" aria-label="技能渲染预览"></canvas>
                <div class="legend"><span><i class="swatch range"></i>范围/碰撞箱</span><span><i class="swatch projectile"></i>投掷物</span><span><i class="swatch target"></i>目标</span></div>
            </div>
            <aside class="info-panel">
                <div class="info-block"><span class="label">技能</span><strong id="info-name">-</strong><span id="info-id" class="muted">-</span></div>
                <div class="info-block"><span class="label">属性 / 类别</span><span id="info-meta">-</span></div>
                <div class="info-block"><span class="label">冷却</span><span id="info-cooldown">-</span></div>
                <div class="info-block"><span class="label">范围</span><span id="info-range">-</span></div>
                <div class="info-block"><span class="label">形状 / 速度</span><span id="info-shape">-</span></div>
                <div class="info-block"><span class="label">等级效果</span><p id="info-level">-</p></div>
                <div class="info-block"><span class="label">渲染映射</span><code id="info-profile">-</code></div>
            </aside>
        </section>
    </main>
    <script src="js/skill-demo.js"></script>
</body>
</html>
