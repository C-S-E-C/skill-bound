<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILL BOUND</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="js/basic.js"></script>
    <script src="js/runtime.js"></script>
    <script src="js/translate.js"></script>
</head>
<body>
    <main>
        <div id="syntropica-logo">
            <img src="https://assets.r2.syntropica.top/logo/white.black.svg" alt="Syntropica Logo">
            <h1 class="translate.syntropica-presents">Syntropica Presents</h1>
        </div>
        <div id="warning">
            <h1 class="translate.warning-title">WARNING</h1>
            <p class="translate.photosensitive-warning">This game may cause photosensitive reactions. Please ensure you are in a well-lit environment while playing.</p>
            <button id="start-game"><span class="translate.start-game">Start Game</span></button>
        </div>
        <h1 class="translate.skill-bound-title loaded"style="font-size: 75px;">SKILL BOUND</h1>
        <h3 class="translate.continue-prompt loaded"style="margin-top:30%; font-size: 25px;z-index: 1;">&gt; &nbsp; Press anywhere to continue &nbsp; &lt;</h3>
    </main>
    <audio id="background-music" loop style="display:none;"><source src="music/waiting.mp3" type="audio/mp3"></audio>
    <video class="loaded" style="height:100%; width:100%; z-index:-1; position:absolute; margin:0; object-fit: fill;" src="https://vdse.bdstatic.com//192d9a98d782d9c74c96f09db9378d93.mp4" preload="auto" playsinline autoplay muted loop></video>
    <noscript><p>JavaScript is required to run this application.</p></noscript>
    <script src="js/index.js"></script>
</body>
</html>
