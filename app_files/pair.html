<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Arena</title>
    <!-- External CSS Files -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pair.css">
    <script src="js/translate.js"></script>
    <script src="js/basic.js"></script>
    <script src="js/runtime.js"></script>
</head>
<body>
    <audio id="background-music" loop style="display:none;">
        <source src="music/waiting.mp3" type="audio/mp3">
    </audio>

    <main id="screen1">
        <h1 id="select-battlefield" class="translate.select-battlefield"></h1>
        <div class="selection-group">
            <select id="map-choice"></select>
        </div>

        <h1 id="battle-mode" class="translate.battle-mode"></h1>
        <div class="selection-group">
            <select id="mode-choice">
                <option value="1" class="translate.1vs1"></option>
                <option value="2" class="translate.2vs2"></option>
                <option value="3" class="translate.3vs3"></option>
                <option value="4" class="translate.4vs4"></option>
            </select>
        </div>

        <h1 id="team-mode" class="translate.team-mode"></h1>
        <div class="selection-group">
            <select id="team-mode-choice">
                <option value="random" class="translate.random"></option>
                <option value="manual" class="translate.manual"></option>
            </select>
        </div>

        <button id="start-fight" class="translate.start-fight"></button>
        <button id="new-room" class="translate.new-room"></button>
        <div class="join-room">
            <input id="room-code" type="text" inputmode="text" autocomplete="off" class="translate.room-code" placeholder="">
            <button id="join-room" class="translate.join-room"></button>
        </div>
    </main>

    <main id="screen2">
        <h1 id="status-text-screen2"><span id="loading-animation"></span><span id="waiting-for-players" class="translate.waiting-for-players"></span></h1>
        <section id="connected-players">
            <div class="player-row">
                <span class="player-status"></span>
                <span class="player-name translate.player-1"></span>
            </div>
            <div class="player-row">
                <span class="player-status"></span>
                <span class="player-name translate.player-2"></span>
            </div>
            <div class="player-row">
                <span class="player-status"></span>
                <span class="player-name translate.player-3"></span>
            </div>
            <div class="player-row">
                <span class="player-status"></span>
                <span class="player-name translate.player-4"></span>
            </div>
        </section>
    </main>

    <main id="screen3">
        <h1 id="status-text-screen3"><span id="choose-team" class="translate.choose-team"></span></h1>
        <br/>
        <div id="people">
            <div id="our-team" class="team-container ours"></div>
            <div class="vs-text translate.vs"></div>
            <div id="opponent-team" class="team-container opponent"></div>
        </div>
        <button id="start-battle" class="translate.start-battle" style="margin-top:30px; font-size: 1rem; padding: 10px 30px;" disabled></button>
        <button id="create-room" class="translate.create-room" style="margin-top:30px; font-size: 1rem; padding: 10px 30px;" disabled></button>
    </main>

    <!-- Page-specific script -->
    <script src="js/pair.js"></script>
</body>
</html>
