<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- External CSS Files -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- External JavaScript Libraries -->
    <script src="js/translate.js"></script>
    <script src="/js/audioHandler.js"></script>
</head>
<body>
    <div id="top-bar">
        <p id="energy" onclick="window.open('energy.html','_blank')"></p>
        <p id="coins"></p>
        <button id="settings" aria-label="Settings" title="Settings"><span>⚙️</span></button>
    </div>
    <div id="controls">
        <button id="map"><span class="translate.map"></span></button>
        <button id="fight" onclick="window.location.href='pair.html'"><span class="translate.fight"></span></button>
        <button id="manual"><span class="translate.manual"></span></button>
    </div>
    <!-- Page-specific script -->
    <script src="js/dashboard.js"></script>
</body>
</html>
