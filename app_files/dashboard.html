<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="translate.dashboard-title">Dashboard</title>
    <!-- External CSS Files -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- External JavaScript Libraries -->
    <script src="js/translate.js"></script>
</head>
<body>
    <audio id="background-music" loop style="display:none;">
        <source src="music/waiting.mp3" type="audio/mp3">
    </audio>
    <div id="top-bar">
        <p id="energy" onclick="window.open('energy.html','_blank')"></p>
        <p id="coins"></p>
        <button id="settings" aria-label="Settings" title="Settings" onclick="window.open('settings.html','_blank')"><span id="translate.settings">⚙️</span></button>
    </div>
    <div id="controls">
        <button id="map"><span id="translate.map">Map</span></button>
        <button id="fight" onclick="window.location.href='pair.html'"><span id="translate.fight">Fight!</span></button>
        <button id="manual"><span id="translate.manual">Manual</span></button>
    </div>
    <!-- Page-specific script -->
    <script src="js/dashboard.js"></script>
</body>
</html>
