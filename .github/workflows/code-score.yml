name: scorecode
on:
  push:
    branches: [frontend]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            js/

      - name: JET2HOLIDAY
        run: echo "DARLING HOLD MY HANDрҹҘөвҖјпёҸрҹ—ЈпёҸрҹ—ЈпёҸNOTHING BEATS A JET 2 HOLIDAY рҹ”ҘрҹҳӯрҹҷҸрҹ”ӣрҹ”қрҹ”қрҹ—ЈпёҸрҹ—ЈпёҸрҹ—ЈпёҸрҹ—ЈпёҸAND RIGHT NOW YOU SAVE 50 POUNDS рҹ’·рҹ’·рҹ’· PER PERSONрҹ—Јрҹ”Ҡрҹ”Ҡрҹ”ҘвҖјпёҸвҖјпёҸвҖјпёҸвҖјпёҸTHAT'S 200 рҹ’· рҹ’· рҹ’· OFF FOR A FAMILY OF 4 рҹ—ЈпёҸрҹ—ЈпёҸрҹ—ЈпёҸрҹ”Ҙрҹ”Ҙрҹ”Ҙрҹ’Ҝ рҹ’Ҝ рҹ’Ҝрҹ’ғрҹҸ»рҹ’ғрҹҸ»рҹ’ғрҹҸ»рҹ’ғрҹҸ»рҹ’ғрҹҸ»"

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install fuck-u-code
        run: go install github.com/Done-0/fuck-u-code/cmd/fuck-u-code@latest

      - name: Scan and generate score files
        id: getscore
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          
          # 生成评分报告
          fuck-u-code analyze --verbose . > score.txt
          
          # 修复：使用 grep 和 sed 精确提取分数
          # 从 "总体评分: 31.60 / 100" 中提取 31.60
          SCORE=$(grep "总体评分:" score.txt | head -1 | sed -n 's/.*总体评分:[[:space:]]*\([0-9.]*\).*/\1/p')
          
          # 如果提取失败，设置默认值
          if [ -z "$SCORE" ]; then
            SCORE="0"
            echo "⚠️ 警告：无法提取分数，使用默认值 0"
          fi
          
          echo "提取的分数: $SCORE"
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          
          # 创建 package.yaml 文件（使用原始分数）
          echo "score: $SCORE" > package.yaml
          echo "timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> package.yaml
          echo "branch: frontend" >> package.yaml
          echo "commit: ${{ github.sha }}" >> package.yaml
          echo "---" >> package.yaml
          cat score.txt >> package.yaml
          
          echo "=== package.yaml ==="
          cat package.yaml

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: |
            score.txt
            package.yaml
          retention-days: 1

      - name: Output summary
        run: |
          # 获取提取的分数（已经是 0-100 的原始分数）
          SCORE_RAW="${{ steps.getscore.outputs.score }}"
          
          # 如果分数是空或0，显示为N/A
          if [ -z "$SCORE_RAW" ] || [ "$SCORE_RAW" = "0" ]; then
            DISPLAY_SCORE="N/A"
          else
            # 分数已经是 0-100 范围，直接使用
            DISPLAY_SCORE="${SCORE_RAW}/100"
          fi
          
          # 生成步骤摘要
          echo "## 📊 代码质量评分结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 评分 | **${DISPLAY_SCORE}** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 源分支 | frontend |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 目标分支 | main |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 提交 | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ 时间 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ 状态 | 已成功更新 main 分支 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🗒️ 详细信息" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat score.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
