<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILL BOUND</title>
    <link rel="manifest" href="pwa/manifest.json">
    <style>
        html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
        body { background: #000; }
        #background-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        #app-frame { position: fixed; inset: 0; display: block; z-index: 1; }
        #cache-status { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; color: #fff; background: rgba(0, 0, 0, .35); font: 14px sans-serif; z-index: 2; }
        #cache-status[hidden] { display: none; }
        #cache-info { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 8px; }
        #cache-status-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #cache-stage { flex: 0 0 auto; white-space: nowrap; }
        #cache-progress { width: 100%; height: 8px; appearance: none; accent-color: #fff; }
        #cache-progress::-webkit-progress-bar { background: rgba(255, 255, 255, .3); }
        #cache-progress::-webkit-progress-value { background: #fff; }
    </style>
    <script src="/js/crypto.min.js"></script>
    <script src="/js/easytier.js"></script>
    <script src="/js/shell.js"></script>
</head>
<body>
    <video id="background-video" muted autoplay loop playsinline preload="auto" aria-hidden="true"></video>
    <div id="cache-status">
        <div id="cache-info">
            <span id="cache-status-text">Preparing offline cache...</span>
            <span id="cache-stage">1/2 Download</span>
        </div>
        <progress id="cache-progress" max="100" value="0"></progress>
    </div>
    <iframe id="app-frame" title="Skill Bound" hidden></iframe>
    <script>
        (async function () {
            "use strict";
            const status = document.getElementById("cache-status");
            const statusText = document.getElementById("cache-status-text");
            const stage = document.getElementById("cache-stage");
            const progress = document.getElementById("cache-progress");
            const frame = document.getElementById("app-frame");
            const cache = await caches.open("app_files");
            const manifest = await fetch("flist.json", { cache: "no-store" }).then((response) => {
                if (!response.ok) throw new Error("Unable to load flist.json");
                return response.json();
            });
            const requiredBytes = Number(manifest.requiredBytes || 0);
            const progressBytes = Math.max(requiredBytes, 1);
            const algorithm = String(manifest.alg || "SHA256").toUpperCase();
            const hashFunctions = {
                MD5: (value) => CryptoJS.MD5(value),
                SHA1: (value) => CryptoJS.SHA1(value),
                SHA224: (value) => CryptoJS.SHA224(value),
                SHA256: (value) => CryptoJS.SHA256(value),
                SHA384: (value) => CryptoJS.SHA384(value),
                SHA512: (value) => CryptoJS.SHA512(value),
            };
            const hashFunction = hashFunctions[algorithm];
            if (!hashFunction) throw new Error("Unsupported manifest hash algorithm: " + algorithm);

            async function doupdate(manifest) {
                const files = Array.isArray(manifest) ? manifest : manifest.files;
                if (!Array.isArray(files) || !files.length) throw new Error("Invalid flist.json");
                const wanted = new Set(files.map((file) => new URL(file.source, location.href).href));
                const oldRequests = await cache.keys();
                await Promise.all(oldRequests.filter((request) => !wanted.has(request.url)).map((request) => cache.delete(request)));

                function megabytes(bytes) { return (bytes / 1048576).toFixed(2) + " MB"; }
                function filename(file) {
                    const value = file.url || file.source;
                    return value.split("/").pop() || value;
                }
                function downloadSource(file) { return file.url || file.source; }
                async function responseBytes(response) {
                    const length = Number(response.headers.get("content-length"));
                    return Number.isFinite(length) && length >= 0 ? length : (await response.clone().blob()).size;
                }
                async function hashBytes(bytes) {
                    return hashFunction(CryptoJS.lib.WordArray.create(bytes)).toString();
                }
                async function hashResponse(response) {
                    return hashBytes(await response.arrayBuffer());
                }
                async function downloadWithProgress(file, index, cachedBytesRef) {
                    const source = new URL(downloadSource(file), location.href).href;
                    const response = await fetch(source, { cache: "no-store" });
                    if (!response.ok) throw new Error("Unable to download " + file.source);
                    if (!response.body) {
                        const bytes = new Uint8Array(await response.arrayBuffer());
                        cachedBytesRef.value += bytes.byteLength;
                        progress.value = Math.min(100, cachedBytesRef.value / progressBytes * 100);
                        statusText.textContent = megabytes(cachedBytesRef.value) + " / " + megabytes(requiredBytes) + " [" + (index + 1) + "/" + files.length + "] " + filename(file);
                        return bytes;
                    }
                    const reader = response.body.getReader();
                    const chunks = [];
                    let loaded = 0;
                    const total = Number(response.headers.get("content-length")) || 0;
                    while (true) {
                        const step = await reader.read();
                        if (step.done) break;
                        chunks.push(step.value);
                        loaded += step.value.byteLength;
                        cachedBytesRef.value += step.value.byteLength;
                        progress.value = Math.min(100, cachedBytesRef.value / progressBytes * 100);
                        const part = total > 0 ? megabytes(loaded) + " / " + megabytes(total) : megabytes(loaded);
                        statusText.textContent = part + " [" + (index + 1) + "/" + files.length + "] " + filename(file);
                    }
                    const bytes = new Uint8Array(loaded);
                    let offset = 0;
                    for (const chunk of chunks) {
                        bytes.set(chunk, offset);
                        offset += chunk.byteLength;
                    }
                    return bytes;
                }
                let cachedBytes = 0;
                for (const file of files) {
                    const target = new URL(file.source, location.href).href;
                    const cached = await cache.match(target);
                    if (cached) cachedBytes += await responseBytes(cached);
                }
                stage.textContent = "1/2 Download";
                for (let index = 0; index < files.length; index += 1) {
                    const file = files[index];
                    const target = new URL(file.source, location.href).href;
                    const expectedHash = String(file.hash || "").toLowerCase();
                    let cached = await cache.match(target);
                    let verified = !!cached;
                    let actualHash = "missing";
                    if (cached && expectedHash) {
                        actualHash = await hashResponse(cached.clone());
                        verified = actualHash === expectedHash;
                    }
                    for (let attempt = 1; attempt <= 3 && !verified; attempt += 1) {
                        const cachedBytesRef = { value: cachedBytes };
                        const downloadedBytes = await downloadWithProgress(file, index, cachedBytesRef);
                        const downloadedHash = await hashBytes(downloadedBytes);
                        actualHash = downloadedHash;
                        if (!expectedHash || downloadedHash === expectedHash) {
                            await cache.put(target, new Response(downloadedBytes));
                            cached = await cache.match(target);
                            cachedBytes = cachedBytesRef.value;
                            verified = true;
                        }
                    }
                    if (!verified) {
                        throw new Error(`${algorithm} mismatch for ${file.source} after 3 attempts: expected ${expectedHash}, got ${actualHash}`);
                    }
                    progress.value = Math.min(100, cachedBytes / progressBytes * 100);
                    statusText.textContent = megabytes(cachedBytes) + " / " + megabytes(requiredBytes) + " [" + (index + 1) + "/" + files.length + "] " + filename(file);
                }
                stage.textContent = "2/2 Verify";
                progress.value = 0;
                for (let index = 0; index < files.length; index += 1) {
                    const file = files[index];
                    const target = new URL(file.source, location.href).href;
                    const expectedHash = String(file.hash || "").toLowerCase();
                    let verified = false;
                    let actualHash = "missing";
                    for (let attempt = 1; attempt <= 3 && !verified; attempt += 1) {
                        let cached = await cache.match(target);
                        if (cached) {
                            actualHash = await hashResponse(cached.clone());
                            verified = !expectedHash || actualHash === expectedHash;
                        }
                        if (!verified && attempt < 3) {
                            const source = new URL(downloadSource(file), location.href).href;
                            const response = await fetch(source, { cache: "no-store" });
                            if (!response.ok) throw new Error("Unable to download " + file.source);
                            const downloadedHash = await hashResponse(response.clone());
                            if (downloadedHash === expectedHash) {
                                await cache.put(target, response.clone());
                                verified = true;
                                actualHash = downloadedHash;
                            }
                        }
                    }
                    if (!verified) {
                        throw new Error(`${algorithm} mismatch for ${file.source} after 3 attempts: expected ${expectedHash}, got ${actualHash}`);
                    }
                    statusText.textContent = "[" + (index + 1) + "/" + files.length + "] " + filename(file);
                }
                localStorage.setItem("curVerId", String(manifest.this?.id ?? 0));
            }

            const storedVersion = localStorage.getItem("curVerId");
            const parsedVersion = storedVersion === null ? NaN : Number(storedVersion);
            const currentVersion = Number.isFinite(parsedVersion) ? parsedVersion : null;
            const latestVersion = Number(manifest.this?.id ?? 0);
            const requiredVersion = Number(manifest.lastRequiredUpdate ?? 0);

            if (currentVersion === null || currentVersion < requiredVersion) {
                await doupdate(manifest);
            } else if (currentVersion < latestVersion && confirm("Update to the latest choosable version?")) {
                await doupdate(manifest);
            }
            await navigator.serviceWorker.register("/sw.js", { scope: "/" });
            await navigator.serviceWorker.ready;
            progress.value = 0;
            frame.src = "/app_files/index.html";//new URL("/app_files/index.html", location.href).href;
            frame.hidden = false;
            status.hidden = true;
        })().catch((error) => {
            console.error("Cache bootstrap failed:", error);
            document.getElementById("cache-status-text").textContent = "Cache error: " + error.message;
            document.getElementById("cache-stage").textContent = "Error";
            document.getElementById("cache-progress").value = 0;
        });
    </script>
</body>
</html>
